name: arch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency: dotfiles-test-archlinux
jobs:
  arch-test:
    runs-on: ubuntu-latest
    # if: ${{ contains(github.event.head_commit.message, "[CI]") }}
    container:
      image: archlinux:latest
    env:
      MISE_PYTHON_PRECOMPILED_FLAVOR: install_only_stripped
    steps:
      - uses: actions/checkout@v3
      - name: Extract branch name for push
        if: github.event_name == 'push'
        run: echo "CURRENT_BRANCH=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
      - name: Extract branch name for pull request
        if: github.event_name == 'pull_request'
        run: echo "CURRENT_BRANCH=${{ github.head_ref }}" >> $GITHUB_ENV
      - name: Initialize and populate keyring
        run: |
          pacman -Sy -q --noconfirm --needed gnupg archlinux-keyring
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --refresh-keys
      - name: Update pacman
        run: pacman -Syu -q --noconfirm
      - name: Install build deps
        run: |
          pacman -S -q --noconfirm --needed \
            sudo git curl \
            base-devel pkgconf oniguruma
      - name: Run chezmoi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh -c "$(curl -fsLS chezmoi.io/get)" -- init --apply --branch ${{ env.CURRENT_BRANCH }} radiol
      # # Error Check
      - name: Run unit tests
        shell: bash
        run: |
          eval "$($HOME/.local/bin/mise activate bash)"
          bash tests/unit/run.sh
      - name: Check sheldon plugins.lock
        shell: bash
        run: |
          bash tests/smoke/sheldon.sh
      - name: Check lazy.nvim dir
        shell: bash
        run: |
          bash tests/smoke/nvim.sh
      - name: Check go app (gomi) is available
        shell: bash
        run: |
          bash tests/smoke/gomi.sh
      - name: Check yazi packages are installed
        shell: bash
        run: |
          bash tests/smoke/yazi-packages.sh
      - name: Check IME config file is deployed only on arch
        shell: bash
        run: |
          bash tests/smoke/im-conf.sh
  manjaro-test:
    runs-on: ubuntu-latest
    # if: ${{ contains(github.event.head_commit.message, "[CI]") }}
    container:
      image: manjarolinux/base:latest
    env:
      MISE_PYTHON_PRECOMPILED_FLAVOR: install_only_stripped
    steps:
      - uses: actions/checkout@v3
      - name: Extract branch name for push
        if: github.event_name == 'push'
        run: echo "CURRENT_BRANCH=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
      - name: Extract branch name for pull request
        if: github.event_name == 'pull_request'
        run: echo "CURRENT_BRANCH=${{ github.head_ref }}" >> $GITHUB_ENV
      - name: Remove community repo from pacman.conf
        run: sed -i '/\[community\]/,/Include/d' /etc/pacman.conf
      - name: Initialize and populate keyring
        run: |
          pacman -Sy -q --noconfirm --needed gnupg manjaro-keyring archlinux-keyring
          pacman-key --init
          pacman-key --populate archlinux manjaro
          pacman-key --refresh-keys
      - name: Update pacman
        run: pacman -Syu -q --noconfirm
      - name: Install build deps
        run: |
          pacman -S -q --noconfirm --needed \
            sudo git curl \
            base-devel pkgconf oniguruma
      - name: Run chezmoi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh -c "$(curl -fsLS chezmoi.io/get)" -- init --apply --branch ${{ env.CURRENT_BRANCH }} radiol
      # # Error Check
      - name: Run unit tests
        shell: bash
        run: |
          eval "$($HOME/.local/bin/mise activate bash)"
          bash tests/unit/run.sh
      - name: Check sheldon plugins.lock
        shell: bash
        run: |
          bash tests/smoke/sheldon.sh
      - name: Check lazy.nvim dir
        shell: bash
        run: |
          bash tests/smoke/nvim.sh
      - name: Check go app (gomi) is available
        shell: bash
        run: |
          bash tests/smoke/gomi.sh
      - name: Check yazi packages are installed
        shell: bash
        run: |
          bash tests/smoke/yazi-packages.sh
      - name: Check IME config file is deployed only on arch
        shell: bash
        run: |
          bash tests/smoke/im-conf.sh
